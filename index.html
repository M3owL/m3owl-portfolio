<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const SUPABASE_URL = 'https://empvklffqwrlllovhgzx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_an1FqOGAgwRQCzxp6UWuvQ_TFadZ9EW';
const supabaseConfigured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');
const supabase=supabaseConfigured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;

function App(){
 const[activeTab,setActiveTab]=useState('portfolio');
 const[reviews,setReviews]=useState([]); const[projects,setProjects]=useState([]); const[loading,setLoading]=useState(true);
 const[session,setSession]=useState(null); const[isAdmin,setIsAdmin]=useState(false); const[error,setError]=useState(''); const[toast,setToast]=useState(''); const[showLogin,setShowLogin]=useState(false); const[configured,setConfigured]=useState(supabaseConfigured);
 const[inviteCodes,setInviteCodes]=useState([]);

 const loadReviews=async(adminView=false)=>{if(!supabase)return; let q=supabase.from('reviews').select('*').order('created_at',{ascending:false}); if(!adminView)q=q.eq('published',true); const{data,error}=await q;if(error)return setError(error.message);setReviews(data||[])};
 const loadProjects=async()=>{if(!supabase)return;const{data,error}=await supabase.from('projects').select('*').order('created_at',{ascending:false});if(error)return setError(error.message);setProjects(data||[])};
 const loadInviteCodes=async()=>{if(!supabase)return;const{data,error}=await supabase.from('invite_codes').select('*').eq('used',false).order('created_at',{ascending:false});if(error)return setError(error.message);setInviteCodes(data||[])};
 const checkAdmin=async(s)=>{if(!supabase||!s?.user){setIsAdmin(false);return false}const{data,error}=await supabase.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();const ok=!error&&!!data;setIsAdmin(ok);return ok};

 useEffect(()=>{
  if(!supabaseConfigured){setConfigured(false);setLoading(false);return}
  let alive=true;
  (async()=>{const{data:{session:s}}=await supabase.auth.getSession();if(!alive)return;setSession(s);const admin=await checkAdmin(s);await Promise.all([loadReviews(admin),loadProjects(),admin?loadInviteCodes():Promise.resolve()]);setLoading(false)})();
  const{data:authSub}=supabase.auth.onAuthStateChange(async(_,s)=>{setSession(s);const admin=await checkAdmin(s);await loadReviews(admin);if(admin)await loadInviteCodes()});
  const channel=supabase.channel('m3owl-live').on('postgres_changes',{event:'*',schema:'public',table:'reviews'},async()=>{const{data:{session:s}}=await supabase.auth.getSession();const admin=await checkAdmin(s);await loadReviews(admin)}).on('postgres_changes',{event:'*',schema:'public',table:'projects'},loadProjects).on('postgres_changes',{event:'*',schema:'public',table:'invite_codes'},async()=>{const{data:{session:s}}=await supabase.auth.getSession();const admin=await checkAdmin(s);if(admin)await loadInviteCodes()}).subscribe();
  return()=>{alive=false;authSub?.subscription?.unsubscribe();supabase.removeChannel(channel)};
 },[]);
 useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2500);return()=>clearTimeout(t)},[toast]);

 const logout=async()=>{if(supabase)await supabase.auth.signOut();setSession(null);setIsAdmin(false);setActiveTab('reviews');setToast('Logged out.')};
 const onLogin=async(s)=>{setSession(s);const admin=await checkAdmin(s);if(!admin){await supabase.auth.signOut();return setError('This account is not an admin.')}await Promise.all([loadReviews(true),loadInviteCodes()]);setShowLogin(false);setActiveTab('admin');setToast('Logged in.')};
 return <div className="min-h-screen flex flex-col">
  <header className="glass sticky top-0 z-40 py-4 px-5 md:px-8 border-b border-gray-800"><div className="max-w-7xl mx-auto flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">
   <button onClick={()=>setActiveTab('about')} className="text-left"><h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-accent to-blue-500">M3owL</h1><p className="text-sm text-gray-400">Jakub K. | Discord: <span className="text-white font-mono">_m3owl</span> | Junior Polish Game Translator</p></button>
   <nav className="flex flex-wrap items-center gap-2 md:gap-5 font-bold">{[['about','About Me'],['portfolio','Portfolio'],['reviews','Reviews']].map(([id,label])=><button key={id} onClick={()=>setActiveTab(id)} className={`px-2 py-2 ${activeTab===id?'text-accent':'text-gray-400 hover:text-white'}`}>{label}</button>)}
    {isAdmin?<><button onClick={()=>setActiveTab('admin')} className={`px-3 py-2 rounded-lg text-sm ${activeTab==='admin'?'bg-cyan-500/10 text-cyan-300 border border-cyan-500/20':'text-gray-400 hover:text-white'}`}>Admin Panel</button><button onClick={logout} className="bg-red-900/80 hover:bg-red-800 text-white px-3 py-2 rounded border border-red-600 text-sm">Logout</button></>:<button onClick={()=>setShowLogin(true)} className="text-sm text-gray-500 hover:text-white">Admin</button>}
   </nav>
  </div></header>
  <main className="flex-grow p-5 md:p-8 max-w-7xl mx-auto w-full">

   {error&&<div className="mb-8 p-4 rounded-xl border border-red-500/30 bg-red-500/10 text-red-200 text-sm">{error}<button className="float-right" onClick={()=>setError('')}>×</button></div>}
   {loading?<div className="py-24 text-center text-gray-500">Loading…</div>:<>{activeTab==='about'&&<AboutMe/>}{activeTab==='portfolio'&&<PortfolioTab projects={projects} setProjects={setProjects} reviews={reviews} isAdmin={isAdmin} onChanged={()=>loadProjects()}/>} {activeTab==='reviews'&&<ReviewsTab reviews={reviews} isAdmin={isAdmin}/>} {activeTab==='admin'&&isAdmin&&<AdminTab reviews={reviews} inviteCodes={inviteCodes} reloadReviews={()=>loadReviews(true)} reloadPublic={()=>loadReviews(false)} reloadCodes={loadInviteCodes} onError={setError} onToast={setToast}/>}</>}
  </main>
  <footer className="max-w-7xl mx-auto w-full px-5 md:px-8 pb-8 text-xs text-gray-600">M3owL · Polish Game Translator · _m3owl</footer>
  {showLogin&&<LoginModal onCancel={()=>setShowLogin(false)} onSuccess={onLogin}/>} {toast&&<div className="fixed bottom-5 right-5 z-[100] glass rounded-xl px-4 py-3 text-sm font-bold text-gray-200 shadow-2xl">{toast}</div>}
 </div>
}

function AboutMe(){return <div className="animate-fade-in max-w-3xl mx-auto space-y-6"><h2 className="text-4xl font-extrabold text-white mb-8 border-b border-gray-800 pb-4">About Me</h2><div className="glass p-8 rounded-xl"><h3 className="text-2xl font-bold text-accent mb-4">Hello, I'm M3owL</h3><p className="text-gray-300 text-lg leading-relaxed mb-4">I am a Junior Polish Game Translator focusing on video games and game-development communities. I translate with attention to context, terminology, consistency and how the text actually feels to a Polish player.</p><p className="text-gray-300 text-lg leading-relaxed">I help developers reach Polish players through accurate, natural and context-aware game translations.</p><div className="mt-8 pt-6 border-t border-gray-700 flex flex-col gap-2"><p><strong className="text-white">Discord:</strong> <span className="font-mono text-accent">_m3owl</span></p><p><strong className="text-white">Role:</strong> Polish Game Translator / Localization Junior</p></div></div></div>}

function PortfolioTab({projects,setProjects,reviews,isAdmin,onChanged}){
 const[show,setShow]=useState(false),[editing,setEditing]=useState(null);
 const open=(p=null)=>{setEditing(p);setShow(true)};
 const save=async(data)=>{if(!supabase)return;if(editing){const{error}=await supabase.from('projects').update({title:data.title,steam_url:data.steamLink,details:data.details,pinned_reviews:data.pinnedReviews||[]}).eq('id',editing.id);if(error)throw error}else{const{error}=await supabase.from('projects').insert({title:data.title,steam_url:data.steamLink||null,details:data.details||'',pinned_reviews:data.pinnedReviews||[]});if(error)throw error}await onChanged();setShow(false)};
 const del=async id=>{if(!confirm('Delete this project permanently?'))return;const{error}=await supabase.from('projects').delete().eq('id',id);if(error)alert(error.message);else onChanged()};
 return <div><div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 border-b border-gray-800 pb-4"><h2 className="text-4xl font-extrabold">Portfolio</h2>{isAdmin&&<button onClick={()=>open()} className="bg-accent hover:bg-cyan-400 text-darker font-extrabold px-6 py-2 rounded">+ Add Project</button>}</div>{projects.length===0?<p className="text-gray-500 text-xl text-center mt-12">No projects added yet.</p>:<div className="space-y-12">{projects.map(project=>{const appId=getSteamAppId(project.steam_url);const banner=appId?`https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/library_hero.jpg`:null;const logo=appId?`https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/logo.png`:null;return <div key={project.id} className="glass rounded-xl overflow-hidden shadow-2xl border border-gray-700 relative">{banner&&<div className="absolute inset-0 opacity-20 pointer-events-none bg-cover bg-center" style={{backgroundImage:`url(${banner})`}}><div className="absolute inset-0 bg-gradient-to-t from-darker via-darker/80 to-transparent"/></div>}<div className="p-8 relative z-10"><div className="flex flex-col md:flex-row md:justify-between md:items-start gap-4 mb-6"><div className="flex items-center gap-4">{logo&&<img src={logo} alt="Game Logo" className="max-h-16 max-w-[200px] object-contain" onError={e=>e.currentTarget.style.display='none'}/>}<div><h3 className="text-3xl font-bold mb-1">{project.title}</h3>{project.steam_url&&<a href={project.steam_url} target="_blank" rel="noreferrer" className="text-accent hover:underline text-sm font-bold">🔗 Steam Store Page</a>}</div></div>{isAdmin&&<div className="flex gap-2"><button onClick={()=>open({id:project.id,title:project.title,steamLink:project.steam_url||'',details:project.details||'',pinnedReviews:project.pinned_reviews||[]})} className="bg-blue-900/50 text-blue-400 border border-blue-800 px-3 py-1 rounded text-sm font-bold">Edit</button><button onClick={()=>del(project.id)} className="bg-red-900/50 text-red-400 border border-red-800 px-3 py-1 rounded text-sm font-bold">Delete</button></div>}</div><div className="text-gray-300 leading-relaxed mb-6 whitespace-pre-wrap">{project.details}</div></div>{project.pinned_reviews?.length>0&&<PinnedReviewsSection ids={project.pinned_reviews} reviews={reviews}/>}</div>})}</div>}{show&&<ProjectFormModal project={editing} reviews={reviews} onSave={save} onCancel={()=>setShow(false)}/>}</div>
}
function PinnedReviewsSection({ids,reviews}){const pinned=ids.map(id=>reviews.find(r=>r.id===id)).filter(Boolean);if(!pinned.length)return null;return <div className="bg-gray-900/90 border-t border-gray-800 p-4 overflow-hidden"><p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 ml-2">Related Reviews</p><div className="flex flex-wrap gap-3">{pinned.map(r=><div key={r.id} className="w-80 bg-gray-800/90 border border-gray-700 rounded-lg p-4"><div className="flex items-start justify-between gap-3 mb-2"><div className="flex items-center gap-3"><img src={r.avatar_url||avatarFallback(r.nickname)} className="w-8 h-8 rounded-full object-cover" alt=""/><div><p className="text-sm font-bold">{r.nickname}</p><p className="text-xs text-accent">{r.role}</p></div></div><Stars value={averageRating(r.ratings)}/></div><p className="text-xs text-gray-300 italic line-clamp-2">“{r.review_text}”</p></div>)}</div></div>}

function ReviewsTab({reviews,isAdmin}){const[showCode,setShowCode]=useState(false);return <div><div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-8 border-b border-gray-800 pb-4"><div><h2 className="text-4xl font-extrabold">Reviews & Testimonials</h2><p className="text-gray-500 mt-2">Feedback from developers and gaming community staff.</p></div>{!isAdmin&&<button onClick={()=>setShowCode(true)} className="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-lg border border-gray-700">Have an invite code?</button></div>{reviews.length===0?<p className="text-gray-500 text-xl text-center mt-12">No published reviews yet.</p>:<div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">{reviews.filter(r=>r.published||isAdmin).map(r=><ReviewCard key={r.id} review={r}/>)}<div>{showCode&&<InviteCodeModal onClose={()=>setShowCode(false)} onSubmitted={()=>setShowCode(false)}/>}</div>}</div>}
function InviteCodeModal({onClose,onSubmitted}){const[code,setCode]=useState(''),[data,setData]=useState(null),[error,setError]=useState(''),[busy,setBusy]=useState(false),[reviewText,setReviewText]=useState('');const verify=async e=>{e.preventDefault();if(!supabase)return;setBusy(true);setError('');const{data:d,error}=await supabase.rpc('get_invite_code_preview',{input_code:code.trim().toUpperCase()});setBusy(false);if(error||!d||!d.length)return setError('Invalid or already used invite code.');setData(d[0]);};const submit=async e=>{e.preventDefault();if(!data||!reviewText.trim())return;setBusy(true);setError('');const{error}=await supabase.rpc('submit_review_with_code',{input_code:code.trim().toUpperCase(),input_discord_username:data.discord_username||null,input_review_text:reviewText.trim()});setBusy(false);if(error)return setError(error.message);alert('Review submitted. It will appear after admin approval.');onSubmitted()};return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4"><div className="glass p-6 rounded-xl w-full max-w-lg border border-gray-700"><div className="flex justify-between mb-5"><h3 className="text-xl font-bold text-accent">Use Invite Code</h3><button onClick={onClose} className="text-gray-500 hover:text-white text-2xl">×</button></div>{!data?<form onSubmit={verify} className="space-y-4"><Field label="Invite code"><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} className="form-input font-mono font-bold" placeholder="ABC123" required/></Field>{error&&<p className="text-red-400 text-sm font-bold">{error}</p>}<button disabled={busy} className="w-full bg-accent text-darker font-bold py-2 rounded">{busy?'Checking…':'Verify code'}</button></form>:<form onSubmit={submit} className="space-y-4"><div className="p-3 bg-gray-900 rounded border border-gray-700 text-sm"><b>{data.nickname}</b><div className="text-accent text-xs">{data.role}</div></div><Field label="Your review"><textarea value={reviewText} onChange={e=>setReviewText(e.target.value)} className="form-input min-h-32" required/></Field>{error&&<p className="text-red-400 text-sm font-bold">{error}</p>}<div className="flex gap-3"><button type="button" onClick={onClose} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded">Cancel</button><button disabled={busy} className="flex-1 bg-accent text-darker font-bold py-2 rounded">{busy?'Sending…':'Submit review'}</button></div></form>}</div></div>}\n\nfunction ReviewCard({review,admin,onEdit,onDelete,onTogglePublish}){const a=averageRating(review.ratings);return <div className={`glass rounded-xl p-6 shadow-xl flex flex-col ${admin&&!review.published?'opacity-50 grayscale border-dashed':''}`}><div className="flex justify-between items-start mb-4 border-b border-gray-700 pb-4 gap-4"><div className="flex items-center gap-4 min-w-0"><img src={review.avatar_url||avatarFallback(review.nickname)} alt="Avatar" className="w-12 h-12 rounded-full object-cover border border-gray-500" onError={e=>e.currentTarget.src=avatarFallback(review.nickname)}/><div className="min-w-0"><h3 className="text-lg font-bold truncate">{review.nickname}</h3><p className="text-xs text-accent font-semibold truncate">{review.role||'Game Developer'}</p>{review.discord_username&&<p className="text-[10px] text-gray-500 truncate">{review.discord_username}</p>}<p className="text-[10px] text-gray-500 mt-1">{formatDate(review.created_at)}</p></div></div>{review.ratings?.length>0&&<div className="text-right flex-shrink-0"><div className="text-sm font-mono font-bold text-yellow-400">{a.toFixed(1)} / 5</div><Stars value={a}/></div>}</div><p className="text-gray-300 text-sm italic flex-grow mb-6">“{review.review_text}”</p>{review.ratings?.length>0&&<div className="space-y-1 bg-gray-900/50 p-3 rounded-lg mb-4">{review.ratings.map((r,i)=><div key={i} className="flex justify-between items-center gap-3"><span className="text-xs font-semibold text-gray-400">{r.category}</span><div className="flex items-center gap-2"><span className="text-yellow-400 text-xs font-mono">{Number(r.value).toFixed(1)}</span><Stars value={Number(r.value)}/></div></div>)}</div>}{admin&&<div className="flex gap-2 mt-auto border-t border-gray-700 pt-4"><button onClick={()=>onTogglePublish(review.id,!review.published)} className="flex-1 text-xs py-2 rounded font-bold bg-gray-700 text-gray-300">{review.published?'Unpublish':'Publish'}</button><button onClick={()=>onEdit(review)} className="flex-1 bg-blue-900/50 text-blue-400 rounded text-xs font-bold py-2">Edit</button><button onClick={()=>onDelete(review.id)} className="flex-1 bg-red-900/50 text-red-400 rounded text-xs font-bold py-2">Delete</button></div>}</div>}

function AdminTab({reviews,inviteCodes,reloadReviews,reloadPublic,reloadCodes,onError,onToast}){const[editing,setEditing]=useState(null),[showForm,setShowForm]=useState(false),[creatingCode,setCreatingCode]=useState(false),[codeBusy,setCodeBusy]=useState(false);
 const del=async id=>{if(!confirm('Delete this review permanently?'))return;const{error}=await supabase.from('reviews').delete().eq('id',id);if(error)return onError(error.message);await Promise.all([reloadReviews(),reloadPublic()]);onToast('Review deleted.')};
 const toggle=async(id,published)=>{const{error}=await supabase.from('reviews').update({published}).eq('id',id);if(error)return onError(error.message);await Promise.all([reloadReviews(),reloadPublic()]);onToast(published?'Review published.':'Review hidden.')};
 const createInviteCode=async e=>{e.preventDefault();if(!supabase)return;const form=new FormData(e.currentTarget);const nickname=String(form.get('nickname')||'').trim();const role=String(form.get('role')||'').trim();if(!nickname||!role)return;setCodeBusy(true);for(let attempt=0;attempt<5;attempt++){const code=Math.random().toString(36).slice(2,8).toUpperCase();const{error}=await supabase.from('invite_codes').insert({code,nickname,role,used:false});if(!error){setCreatingCode(false);e.currentTarget.reset();await reloadCodes();onToast(`Invite code ${code} created.`);setCodeBusy(false);return}if(error.code!=='23505'){setCodeBusy(false);return onError(error.message)}}setCodeBusy(false);onError('Could not generate a unique invite code. Please try again.')};
 const revokeCode=async id=>{if(!confirm('Delete this unused invite code?'))return;const{error}=await supabase.from('invite_codes').delete().eq('id',id).eq('used',false);if(error)return onError(error.message);await reloadCodes();onToast('Invite code revoked.')};
 return <div><div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 border-b border-gray-800 pb-4"><div><h2 className="text-4xl font-extrabold">Admin Panel</h2><p className="text-gray-500 mt-2">Reviews, projects and invite codes are stored in Supabase.</p></div><div className="flex gap-2 flex-wrap"><button onClick={()=>{setEditing(null);setShowForm(true)}} className="bg-accent hover:bg-cyan-400 text-darker font-extrabold px-5 py-2 rounded">+ Add Review</button><button onClick={()=>setCreatingCode(true)} className="bg-purple-900/50 hover:bg-purple-800 text-purple-300 border border-purple-800 px-4 py-2 rounded font-bold">+ Invite Code</button></div></div>
 {inviteCodes.length>0&&<div className="mb-8 p-4 bg-gray-900 border border-gray-700 rounded-lg"><div className="flex items-center justify-between gap-3 mb-3"><p className="text-sm font-bold text-gray-400">Active Invite Codes</p><span className="text-xs text-gray-600">Each code is one-time use and expires immediately after submission.</span></div><div className="flex flex-wrap gap-3">{inviteCodes.map(c=><div key={c.id} className="bg-gray-800 border border-gray-700 p-3 rounded-lg flex items-center gap-3"><span className="text-xs text-white">{c.nickname}</span><span className="text-xs text-gray-500">{c.role}</span><span className="text-xs text-accent font-mono font-bold">{c.code}</span><button className="text-red-400 text-xs hover:text-red-300" onClick={()=>revokeCode(c.id)} title="Revoke unused code">×</button></div>)}</div></div>}
 {reviews.length===0?<div className="glass rounded-xl p-10 text-center text-gray-500">No reviews in the database.</div>:<div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">{reviews.map(r=><ReviewCard key={r.id} review={r} admin onEdit={r=>{setEditing(r);setShowForm(true)}} onDelete={del} onTogglePublish={toggle}/>)}</div>}
 {showForm&&<ReviewEditor review={editing} preload={editing?.used?editing:null} onCancel={()=>setShowForm(false)} onSaved={async()=>{setShowForm(false);await Promise.all([reloadReviews(),reloadPublic()]);onToast(editing?'Review updated.':'Review created.')}} onError={onError}/>} 
 {creatingCode&&<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4"><div className="glass p-6 rounded-xl w-full max-w-md border border-gray-700"><div className="flex justify-between items-center mb-5"><div><h3 className="text-xl font-bold text-purple-300">Generate Invite Code</h3><p className="text-xs text-gray-500 mt-1">One-time use. The code becomes invalid after the review is submitted.</p></div><button onClick={()=>setCreatingCode(false)} className="text-gray-500 hover:text-white text-2xl">×</button></div><form onSubmit={createInviteCode} className="space-y-4"><Field label="Reviewer nickname"><input name="nickname" className="form-input" required/></Field><Field label="Reviewer role"><input name="role" className="form-input" placeholder="Community Manager" required/></Field><div className="flex gap-3"><button type="button" onClick={()=>setCreatingCode(false)} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded">Cancel</button><button disabled={codeBusy} className="flex-1 bg-purple-500 hover:bg-purple-400 disabled:opacity-50 text-white font-bold py-2 rounded">{codeBusy?'Generating…':'Generate'}</button></div></form></div></div>}
 </div>}

function LoginModal({onCancel,onSuccess}){const[email,setEmail]=useState(''),[password,setPassword]=useState(''),[error,setError]=useState(''),[busy,setBusy]=useState(false);const login=async e=>{e.preventDefault();if(!supabase)return;setBusy(true);setError('');const{data,error}=await supabase.auth.signInWithPassword({email,password});setBusy(false);if(error)return setError(error.message);onSuccess(data.session)};return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4"><div className="glass p-8 rounded-xl w-full max-w-md border border-gray-700"><div className="flex justify-between"><h2 className="text-2xl font-bold text-accent mb-6">Admin Login</h2><button onClick={onCancel} className="text-gray-500 hover:text-white text-2xl">×</button></div><form onSubmit={login} className="space-y-4"><Field label="Email"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="form-input" required/></Field><Field label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="form-input" required/></Field>{error&&<p className="text-red-400 text-sm font-bold">{error}</p>}<div className="flex gap-3"><button disabled={busy} className="flex-1 bg-accent text-darker font-bold py-2 rounded">{busy?'Logging in…':'Login'}</button><button type="button" onClick={onCancel} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded">Cancel</button></div></form></div></div>}

function ReviewEditor({review,onCancel,onSaved,onError,preload}){const[form,setForm]=useState(()=>({nickname:review?.nickname||preload?.nickname||'',discord_username:review?.discord_username||'',role:review?.role||preload?.role||'',review_text:review?.review_text||'',avatar_url:review?.avatar_url||preload?.avatar_url||'',ratings:Array.isArray(review?.ratings)?review.ratings:DEFAULT_CATEGORIES.map(x=>({...x})),published:review?.published??true}));const[saving,setSaving]=useState(false),[uploading,setUploading]=useState(false);const avg=useMemo(()=>averageRating(form.ratings),[form.ratings]);
 const upload=async file=>{if(!file||!supabase)return;if(file.size>6*1024*1024)return onError('Avatar must be under 6 MB.');setUploading(true);const path=`${crypto.randomUUID()}-${file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-')}`;const{error}=await supabase.storage.from('review-avatars').upload(path,file,{upsert:false,contentType:file.type});if(error){setUploading(false);return onError(error.message)}const{data}=supabase.storage.from('review-avatars').getPublicUrl(path);setForm(f=>({...f,avatar_url:data.publicUrl}));setUploading(false)};
 const save=async e=>{e.preventDefault();if(!supabase)return;if(!form.nickname.trim()||!form.review_text.trim())return onError('Nickname and review text are required.');setSaving(true);const payload={nickname:form.nickname.trim(),discord_username:form.discord_username.trim()||null,role:form.role.trim()||null,review_text:form.review_text.trim(),avatar_url:form.avatar_url.trim()||null,ratings:form.ratings.map(r=>({category:String(r.category||'').trim(),value:Math.max(0,Math.min(5,Math.round(Number(r.value)*2)/2))})).filter(r=>r.category&&Number.isFinite(r.value)),published:!!form.published};const result=review?await supabase.from('reviews').update(payload).eq('id',review.id):await supabase.from('reviews').insert(payload);setSaving(false);if(result.error)return onError(result.error.message);await onSaved()};
 return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[90] p-4 overflow-y-auto"><div className="glass p-6 md:p-8 rounded-xl w-full max-w-3xl border border-gray-700 max-h-[94vh] overflow-y-auto"><div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-accent">{review?'Edit Review':'Add Review'}</h2><button onClick={onCancel} className="text-gray-500 hover:text-white text-2xl">×</button></div><form onSubmit={save} className="space-y-5"><div className="grid md:grid-cols-2 gap-4"><Field label="Reviewer nickname"><input value={form.nickname} onChange={e=>setForm({...form,nickname:e.target.value})} className="form-input" required/></Field><Field label="Discord username"><input value={form.discord_username} onChange={e=>setForm({...form,discord_username:e.target.value})} className="form-input"/></Field><Field label="Role"><input value={form.role} onChange={e=>setForm({...form,role:e.target.value})} className="form-input" placeholder="Community Manager"/></Field><Field label="Reviewer avatar"><input type="file" accept="image/*" disabled={uploading} onChange={e=>upload(e.target.files?.[0])} className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm"/>{uploading&&<div className="text-xs text-gray-500 mt-2">Uploading…</div>}{form.avatar_url&&<img src={form.avatar_url} className="w-12 h-12 rounded-full object-cover mt-3" alt=""/>}</Field></div><Field label="Review text"><textarea value={form.review_text} onChange={e=>setForm({...form,review_text:e.target.value})} className="form-input min-h-36" required/></Field><div className="p-4 bg-gray-900 rounded border border-gray-700"><div className="flex justify-between items-center mb-4"><div><div className="text-sm font-bold text-accent">Ratings · Average: {avg.toFixed(1)} / 5</div><div className="text-xs text-gray-500">Click the left/right half of a star for 0.5 steps.</div></div><button type="button" onClick={()=>setForm(f=>({...f,ratings:[...f.ratings,{category:'New category',value:5}]}))} className="text-xs bg-gray-800 border border-gray-700 rounded px-3 py-2 font-bold">+ Add category</button></div><div className="space-y-3">{form.ratings.map((r,i)=><div key={i} className="grid grid-cols-[1fr_auto_auto] items-center gap-2"><input value={r.category} onChange={e=>{const a=[...form.ratings];a[i]={...a[i],category:e.target.value};setForm({...form,ratings:a})}} className="bg-gray-950 border border-gray-700 rounded p-2 text-white text-sm min-w-0"/><InteractiveStars value={Number(r.value)} onChange={v=>{const a=[...form.ratings];a[i]={...a[i],value:v};setForm({...form,ratings:a})}}/><div className="flex items-center gap-2"><span className="text-xs text-yellow-400 font-mono">{Number(r.value).toFixed(1)}</span><button type="button" onClick={()=>setForm(f=>({...f,ratings:f.ratings.filter((_,n)=>n!==i)}))} className="text-red-400">×</button></div></div>)}</div></div><label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={form.published} onChange={e=>setForm({...form,published:e.target.checked})}/>Publish immediately</label><div className="flex gap-3 pt-2 border-t border-gray-700"><button type="button" onClick={onCancel} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded">Cancel</button><button disabled={saving||uploading} className="flex-1 bg-accent disabled:opacity-50 text-darker font-bold py-2 rounded">{saving?'Saving…':'Save Review'}</button></div></form></div></div>}
function ProjectFormModal({project,reviews,onSave,onCancel}){const[form,setForm]=useState(project||{title:'',steamLink:'',details:'',pinnedReviews:[]});const save=async e=>{e.preventDefault();try{await onSave(form)}catch(err){alert(err.message)}};return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[80] p-4 overflow-y-auto"><div className="glass p-8 rounded-xl w-full max-w-2xl border border-gray-700"><h2 className="text-2xl font-bold mb-6 text-accent">{project?'Edit Project':'New Project'}</h2><form onSubmit={save} className="space-y-4"><Field label="Game Title"><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} className="form-input" required/></Field><Field label="Steam URL"><input value={form.steamLink} onChange={e=>setForm({...form,steamLink:e.target.value})} className="form-input"/></Field><Field label="Translation Details"><textarea value={form.details} onChange={e=>setForm({...form,details:e.target.value})} className="form-input h-32"/></Field><div><label className="block text-sm font-bold text-accent mb-2">Pin Reviews to this Project</label><div className="bg-gray-900 border border-gray-700 p-4 rounded max-h-48 overflow-y-auto space-y-2">{reviews.map(r=><label key={r.id} className="flex items-center gap-3 p-2 hover:bg-gray-800 rounded"><input type="checkbox" checked={(form.pinnedReviews||[]).includes(r.id)} onChange={()=>{const p=(form.pinnedReviews||[]).includes(r.id)?form.pinnedReviews.filter(id=>id!==r.id):[...(form.pinnedReviews||[]),r.id];setForm({...form,pinnedReviews:p})}}/><img src={r.avatar_url||avatarFallback(r.nickname)} className="w-6 h-6 rounded-full object-cover" alt=""/><span className="text-sm font-bold truncate">{r.nickname}</span></label>)}{reviews.length===0&&<p className="text-xs text-gray-500">No reviews available.</p>}</div></div><div className="flex gap-4 pt-4 border-t border-gray-700"><button type="submit" className="flex-1 bg-accent text-darker font-bold py-2 rounded">Save Project</button><button type="button" onClick={onCancel} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded">Cancel</button></div></form></div></div>}
function Field({label,children}){return <label className="block"><span className="block text-sm font-bold text-gray-400 mb-1">{label}</span>{children}</label>}
function InteractiveStars({value,onChange}){return <div className="flex items-center">{[1,2,3,4,5].map(s=><button key={s} type="button" className="star-button" title={`Set ${s} stars`} onClick={e=>{const rect=e.currentTarget.getBoundingClientRect();onChange((e.clientX-rect.left)<rect.width/2?s-.5:s)}}>{s<=Math.floor(value)?'⭐':(s-.5===value?'⭐':'☆')}</button>)}</div>}
function Stars({value}){return <div className="flex gap-0.5 items-center">{[1,2,3,4,5].map(s=><span key={s} className="text-[1rem] leading-none">{s<=Math.floor(value)?'⭐':(s-.5===Number(value)?'⭐':'☆')}</span>)}</div>}
function getSteamAppId(url){if(!url)return null;const m=url.match(/\/app\/(\d+)/);return m?m[1]:null}
function averageRating(ratings){if(!Array.isArray(ratings)||!ratings.length)return 0;const v=ratings.map(r=>Number(r.value)).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function formatDate(v){return v?new Date(v).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):''}
function avatarFallback(name){return `https://ui-avatars.com/api/?name=${encodeURIComponent(name||'User')}&background=0f172a&color=fff`}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
